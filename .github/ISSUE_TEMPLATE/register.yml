name: Project Repository Registration
description: 본인 프로젝트 Repository(<GitHub ID>-<저장소 이름>)를 자동으로 생성합니다.
title: "Project Repository Registration"
labels: ["registration"]
body:
  - type: markdown
    attributes:
      value: |
        ## Project Repository Registration

        - 이 Issue를 제출하면 **즉시 자동으로** `rita-codespace/<본인 GitHub ID>-<저장소 이름>` Repository가 생성됩니다. 관리자 승인 절차는 없습니다.
        - GitHub ID는 **이 Issue를 작성한 계정**에서 자동으로 확인하므로 따로 입력하지 않습니다.
        - 생성되는 Repository는 **Public**으로 공개됩니다. 누구나 열람할 수 있으니 비밀번호, API 키, 개인정보를 올리지 마세요.
        - 본인 Repository에는 **Write(push)** 권한이 부여되며, 다른 학생의 Repository는 열람만 가능합니다.
        - 처리 결과는 몇 분 안에 이 Issue의 댓글로 안내됩니다. 댓글의 초대(Invitation) 링크에서 **Accept**를 눌러야 Push할 수 있습니다.
        - 프로젝트마다 저장소 이름을 다르게 적으면 여러 개(계정당 최대 5개)를 만들 수 있습니다. 같은 이름으로 다시 신청하면 기존 Repository를 안내합니다.
  - type: input
    id: project-name
    attributes:
      label: 프로젝트명
      placeholder: "예: 스마트 캠퍼스 길찾기"
    validations:
      required: true
  - type: input
    id: repo-name
    attributes:
      label: 저장소 이름 (Repository name)
      description: |
        영문 소문자, 숫자, 하이픈(-)만 사용해 2~40자로 적어 주세요. 실제 이름은 `<본인 GitHub ID>-<저장소 이름>`이 됩니다.
        같은 이름으로 다시 신청하면 새로 만들지 않고 기존 Repository를 안내합니다. 한 계정당 최대 5개까지 만들 수 있습니다.
      placeholder: "예: smart-campus"
    validations:
      required: true
  - type: textarea
    id: project-description
    attributes:
      label: 프로젝트 간단 설명
      placeholder: "프로젝트의 목적과 주요 기능을 2~3문장으로 적어 주세요."
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 확인
      options:
        - label: "Issue를 제출하면 Repository가 자동으로 생성되며, 이 Repository는 Public으로 공개된다는 점을 이해했습니다."
          required: true
