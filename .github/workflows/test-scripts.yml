name: Test registration scripts

# Runs the offline tests (fake gh, no secrets) when the automation changes.
on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/run-tests.sh
